[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["fastcrypto-rs contributors"]

[workspace.dependencies]
fastcrypto = { path = "crates/fastcrypto", version = "0.1.0", default-features = false }
fastcrypto-core = { path = "crates/fastcrypto-core", version = "0.1.0", default-features = false }
fastcrypto-x86 = { path = "crates/fastcrypto-x86", version = "0.1.0" }
fastcrypto-aarch64 = { path = "crates/fastcrypto-aarch64", version = "0.1.0" }
zeroize = { version = "1.9", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
inline_always = "warn"
manual_let_else = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
unreadable_literal = "warn"
use_self = "warn"
wildcard_imports = "warn"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
