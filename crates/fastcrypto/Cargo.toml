[package]
name = "fastcrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Experimental high-performance cryptography for HTTPS/TLS workloads"

[dependencies]
fastcrypto-core = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
fastcrypto-x86 = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
fastcrypto-aarch64 = { workspace = true }

[features]
default = ["std"]
# The aarch64 crate's `std` feature only turns on its SHA-2 feature probe; the
# X25519 backend it also provides is no_std and always present.
std = ["fastcrypto-core/std", "fastcrypto-aarch64/std"]

[lints]
workspace = true

